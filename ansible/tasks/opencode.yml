---
- name: Check installed OpenCode version
  ansible.builtin.command: '"{{ ansible_env.HOME }}/.opencode/bin/opencode" --version'
  register: opencode_check
  failed_when: false
  changed_when: false

- name: Back up OpenCode V1 before migration
  ansible.builtin.shell: |
    set -eu
    umask 077
    backup={{ (ansible_env.HOME ~ '/.opencode/v1-backup') | quote }}
    mkdir -p "$backup"
    cp -a {{ (ansible_env.HOME ~ '/.opencode/bin/opencode') | quote }} "$backup/opencode"
    if [ -d {{ (ansible_env.HOME ~ '/.config/opencode') | quote }} ]; then
      cp -a {{ (ansible_env.HOME ~ '/.config/opencode') | quote }} "$backup/config"
    fi
    touch "$backup/complete"
  args:
    creates: "{{ ansible_env.HOME }}/.opencode/v1-backup/complete"
  when: opencode_check.rc == 0 and opencode_check.stdout is match('^1[.]')

- name: Install OpenCode 2 or migrate OpenCode 1
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path
  args:
    executable: /bin/bash
  when: opencode_check.rc != 0 or opencode_check.stdout is match('^1[.]')

- name: Find shell config files that may hold installer-added OpenCode PATH lines
  ansible.builtin.find:
    paths: "{{ ansible_env.HOME }}"
    patterns: ['.bashrc', '.bash_profile', '.profile', '.ashrc', '.zshrc', '.zshenv']
    file_type: file
    hidden: true
  register: opencode_shell_config_files

- name: Remove installer-added OpenCode PATH lines from shell config files
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '(?m)^(# opencode\n)?export PATH={{ ansible_env.HOME | regex_escape }}/\.opencode/bin:\$PATH\n?'
    replace: ""
  loop: "{{ opencode_shell_config_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Ensure ~/.config/opencode directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/opencode"
    state: directory
    mode: "0755"

- name: Merge OpenCode global config
  ansible.builtin.command: "{{ playbook_dir }}/../scripts/merge-opencode-config.sh {{ ansible_env.HOME }}/.config/opencode/opencode.json"
  environment:
    AI_ASSISTANTS_MCP_CATALOG: "{{ ai_assistants_mcp_catalog | to_json }}"
    AI_ASSISTANTS_MCPS: "{{ ai_assistants_mcps | to_json }}"
  register: opencode_config_merge
  changed_when: opencode_config_merge.rc == 2
  failed_when: opencode_config_merge.rc not in [0, 2]
