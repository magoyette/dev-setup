---
- name: Ensure user-specific global agent context exists
  ansible.builtin.copy:
    content: ""
    dest: "{{ playbook_dir }}/../global-agent-context.local.md"
    force: false
    mode: "0600"

- name: Ensure shared global agent context directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/dev-setup"
    state: directory
    mode: "0700"

# The template appends a sandbox section selected by context_assistant.
- name: Generate global agent context for Claude Code
  ansible.builtin.template:
    src: global-agent-context.md.j2
    dest: "{{ ansible_env.HOME }}/.config/dev-setup/global-agent-context.claude-code.md"
    mode: "0600"
  vars:
    context_assistant: claude-code

- name: Generate global agent context for Codex
  ansible.builtin.template:
    src: global-agent-context.md.j2
    dest: "{{ ansible_env.HOME }}/.config/dev-setup/global-agent-context.codex.md"
    mode: "0600"
  vars:
    context_assistant: codex

- name: Generate global agent context for OpenCode
  ansible.builtin.template:
    src: global-agent-context.md.j2
    dest: "{{ ansible_env.HOME }}/.config/dev-setup/global-agent-context.opencode.md"
    mode: "0600"
  vars:
    context_assistant: opencode

- name: Deploy global agent context for Claude Code
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.config/dev-setup/global-agent-context.claude-code.md"
    dest: "{{ ansible_env.HOME }}/.claude/CLAUDE.md"
    state: link
    force: true

- name: Deploy global agent context for Codex
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.config/dev-setup/global-agent-context.codex.md"
    dest: "{{ ansible_env.HOME }}/.codex/AGENTS.md"
    state: link
    force: true

- name: Ensure OpenCode global config directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/opencode"
    state: directory
    mode: "0755"

- name: Deploy global agent context for OpenCode
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.config/dev-setup/global-agent-context.opencode.md"
    dest: "{{ ansible_env.HOME }}/.config/opencode/AGENTS.md"
    state: link
    force: true
