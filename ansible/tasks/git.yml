---
- name: Configure git user name
  community.general.git_config:
    name: user.name
    scope: global
    value: "{{ git_user_name }}"

- name: Configure git user email
  community.general.git_config:
    name: user.email
    scope: global
    value: "{{ git_user_email }}"

- name: Configure git default branch
  community.general.git_config:
    name: init.defaultBranch
    scope: global
    value: main

- name: Configure git push autoSetupRemote
  community.general.git_config:
    name: push.autoSetupRemote
    scope: global
    value: "true"

- name: Set git conflictStyle
  community.general.git_config:
    name: merge.conflictStyle
    scope: global
    value: "zdiff3"

- name: Set git diff colorMoved
  community.general.git_config:
    name: diff.colorMoved
    scope: global
    value: "default"

- name: Validate delta theme selector
  ansible.builtin.assert:
    that:
      - delta_theme is string
      - delta_theme | length > 0
      - delta_theme is not search('\s')
    fail_msg: >-
      delta_theme must be a non-empty value without whitespace. Use "dark", "light",
      or a named theme from Delta's themes.gitconfig.

- name: Ensure Delta themes directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/delta"
    state: directory
    mode: "0755"
  when: delta_theme not in ['dark', 'light']

- name: Download Delta community themes
  ansible.builtin.get_url:
    url: "{{ delta_themes_url }}"
    dest: "{{ ansible_env.HOME }}/.config/delta/themes.gitconfig"
    mode: "0644"
  when: delta_theme not in ['dark', 'light']

- name: Include Delta community themes in Git configuration
  community.general.git_config:
    name: include.path
    scope: global
    value: "{{ ansible_env.HOME }}/.config/delta/themes.gitconfig"
    add_mode: add
  when: delta_theme not in ['dark', 'light']

- name: Read Delta community themes
  ansible.builtin.slurp:
    src: "{{ ansible_env.HOME }}/.config/delta/themes.gitconfig"
  register: delta_themes_file
  when: delta_theme not in ['dark', 'light']

- name: Validate selected Delta community theme
  ansible.builtin.assert:
    that:
      - delta_theme in (delta_themes_file.content | b64decode | regex_findall('(?m)^\\[delta "([^"]+)"\\]$'))
    fail_msg: >-
      Delta theme "{{ delta_theme }}" was not found in
      {{ ansible_env.HOME }}/.config/delta/themes.gitconfig.
  when: delta_theme not in ['dark', 'light']

- name: Set delta named theme feature
  community.general.git_config:
    name: delta.features
    scope: global
    state: "{{ 'absent' if delta_theme in ['dark', 'light'] else 'present' }}"
    value: "{{ delta_theme }}"

- name: Set delta dark mode
  community.general.git_config:
    name: delta.dark
    scope: global
    state: "{{ 'present' if delta_theme == 'dark' else 'absent' }}"
    value: "true"

- name: Set delta light mode
  community.general.git_config:
    name: delta.light
    scope: global
    state: "{{ 'present' if delta_theme == 'light' else 'absent' }}"
    value: "true"

- name: Configure delta as git pager
  community.general.git_config:
    name: core.pager
    scope: global
    value: "delta"

- name: Configure delta as git diffFilter
  community.general.git_config:
    name: interactive.diffFilter
    scope: global
    value: "delta --color-only"

- name: Set delta navigate
  community.general.git_config:
    name: delta.navigate
    scope: global
    value: "true"

- name: Set delta line numbers
  community.general.git_config:
    name: delta.line-numbers
    scope: global
    value: "true"

- name: Set delta hyperlinks
  community.general.git_config:
    name: delta.hyperlinks
    scope: global
    value: "true"

- name: Set delta hyperlinks format
  community.general.git_config:
    name: delta.hyperlinks-file-link-format
    scope: global
    value: "vscode://file/{path}:{line}"

- name: Configure optional git core editor
  community.general.git_config:
    name: core.editor
    scope: global
    value: "{{ git_core_editor }}"
  when: (git_core_editor | default('') | trim | length) > 0

- name: Check if Git for Windows credential manager exists
  ansible.builtin.stat:
    path: "/mnt/c/Program Files/Git/mingw64/bin/git-credential-manager.exe"
  register: gcm_stat

- name: Ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: "0755"
  when: gcm_stat.stat.exists

- name: Create symlink for git-credential-manager (avoids spaces in path)
  ansible.builtin.file:
    src: "/mnt/c/Program Files/Git/mingw64/bin/git-credential-manager.exe"
    dest: "{{ ansible_env.HOME }}/.local/bin/git-credential-manager"
    state: link
  when: gcm_stat.stat.exists

- name: Configure git credential helper
  community.general.git_config:
    name: credential.helper
    scope: global
    value: "{{ ansible_env.HOME }}/.local/bin/git-credential-manager"
  when: gcm_stat.stat.exists

- name: Warn if Git for Windows credential manager not found
  ansible.builtin.debug:
    msg: "Git for Windows credential manager not found at /mnt/c/Program Files/Git/mingw64/bin/git-credential-manager.exe - skipping credential helper setup"
  when: not gcm_stat.stat.exists

- name: Configure git aliases
  ansible.builtin.command: "{{ playbook_dir }}/../scripts/sync-git-aliases.sh"
  register: git_alias_sync
  changed_when: git_alias_sync.rc == 10
  failed_when: git_alias_sync.rc not in [0, 10]
  when: install_git_aliases | default(true)

- name: Check repository hooks path
  ansible.builtin.command: git -C "{{ playbook_dir }}/.." config --local --get core.hooksPath
  register: repo_hooks_path
  failed_when: false
  changed_when: false

- name: Install repository git hooks
  ansible.builtin.command: "{{ playbook_dir }}/../scripts/install-git-hooks.sh"
  when: repo_hooks_path.stdout != ".githooks"
