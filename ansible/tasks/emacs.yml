---
- name: Enable deb-src repositories for Emacs dependencies
  become: true
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/ubuntu.sources
    regexp: "^Types: deb$"
    replace: "Types: deb deb-src"
  register: deb_src_enabled

- name: Update apt cache after enabling deb-src
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: deb_src_enabled.changed

- name: Install Emacs build dependencies
  become: true
  ansible.builtin.apt:
    name: emacs
    state: build-dep

- name: Install libmagick development packages
  become: true
  ansible.builtin.apt:
    name:
      - libmagickwand-dev
      - libmagickcore-dev
    state: present

- name: Install Emacs feature build dependencies
  become: true
  ansible.builtin.apt:
    name:
      - "{{ emacs_libgccjit_dev_package }}"
    state: present

# tree-sitter is built from source into /usr/local instead of relying on the
# apt libtree-sitter0/libtree-sitter-dev packages: Ubuntu is stuck on 0.20.8,
# which only supports grammar ABI 13-14, while current grammar bundles ship
# ABI 15. See tasks/libtree-sitter.yml. `apt build-dep emacs` above may still
# transitively pull libtree-sitter-dev, but that is incidental: the source
# build below resolves tree-sitter via pkg-config, which prefers /usr/local.
- ansible.builtin.import_tasks: libtree-sitter.yml

- name: Check installed Emacs version
  ansible.builtin.command: emacs --version
  register: emacs_version_output
  failed_when: false
  changed_when: false

- name: Check Emacs tree-sitter library ABI version
  ansible.builtin.command: emacs -Q --batch --eval "(princ (treesit-library-abi-version))"
  register: emacs_treesit_abi_output
  failed_when: false
  changed_when: false

- name: Install Emacs {{ emacs_version }} from source
  ansible.builtin.command: "{{ playbook_dir }}/../scripts/install-emacs-in-ubuntu.sh {{ emacs_version }}"
  when: >-
    emacs_version_output.rc != 0 or
    emacs_version not in emacs_version_output.stdout or
    emacs_treesit_abi_output.rc != 0 or
    (emacs_treesit_abi_output.stdout | trim | int) < emacs_min_treesit_abi_version or
    libtree_sitter_installed.changed

- ansible.builtin.import_tasks: emacs-lsp-booster.yml
- name: Add emacs terminal alias
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    regexp: "^alias emacs="
    line: 'alias emacs="emacs -nw"'
    state: present

- name: Add emacsclient scratch buffer alias
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    regexp: "^alias e="
    line: "alias e='emacsclient -t -a \"\" --eval \"(progn (switch-to-buffer \\\"*scratch*\\\") nil)\"'"
    state: present

- name: Add emacsclient Magit status alias
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    regexp: "^alias eg="
    line: "alias eg='emacsclient -t -a \"\" --eval \"(progn (magit-status) nil)\"'"
    state: present

- ansible.builtin.import_tasks: emacs-node.yml
