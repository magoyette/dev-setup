---
- name: Check retired tldr pipx venv
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.local/share/pipx/venvs/tldr"
  register: retired_tldr_venv

- name: Uninstall retired tldr pipx package
  ansible.builtin.command:
    argv:
      - "{{ ansible_env.HOME }}/.pyenv/bin/pyenv"
      - exec
      - pipx
      - uninstall
      - tldr
  environment:
    PYENV_ROOT: "{{ ansible_env.HOME }}/.pyenv"
    PATH: "{{ ansible_env.HOME }}/.pyenv/bin:{{ ansible_env.HOME }}/.pyenv/shims:{{ ansible_env.PATH }}"
    PIPX_HOME: "{{ ansible_env.HOME }}/.local/share/pipx"
    PIPX_BIN_DIR: "{{ ansible_env.HOME }}/.local/bin"
    PIPX_MAN_DIR: "{{ ansible_env.HOME }}/.local/share/man"
  when: retired_tldr_venv.stat.exists
  changed_when: true

- name: Remove retired tldr client data and cache
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ansible_env.HOME }}/.cache/tldr"
    - "{{ ansible_env.HOME }}/.local/share/tldr"
