---
# Version of this playbook. Bumped with each release; release.sh refuses to tag
# when this value does not match the prompted release version.
playbook_version: "13.1.2"
# Minimum previously applied playbook version required by this version.
# ansible/version-gate.yml fails before any change when the machine's
# recorded applied version is lower. Version 13.0.0 removes the one-time
# cleanup tasks for retired tools and legacy settings; 12.1.0 is the last
# version that still contained them, so machines without a qualifying
# record must apply it (or a later version that keeps them) first.
min_previously_applied_version: "12.1.0"
# Assumed applied version for machines without an applied-version record:
# provisioned before version tracking (12.1.0) or a fresh clone. Must stay
# below the minimum of any release that relies on tracked history, so
# 13.0.0 blocks record-less machines until they apply a qualifying version.
pre_tracking_assumed_applied_version: "12.0.0"
# Machine-local record of the last fully applied playbook version, read by
# ansible/version-gate.yml and written by ansible/version-record.yml.
applied_version_record_path: "{{ ansible_env.HOME }}/.local/state/dev-setup/applied-version"
fnm_node_version: lts-latest
# Older Bun releases abort when the nono sandbox denies reads of ancestor
# directories, breaking sandboxed OpenCode. The node playbook upgrades older
# installations to this tested minimum and keeps newer releases.
bun_minimum_version: "1.4.2"
bun_minimum_archive_name: "bun-linux-x64.zip"
bun_minimum_archive_sha256: "36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913"
python_version: "3.13.12"
pyenv_version: "v2.5.3"
uv_version: "0.9.21"
emacs_version: "31.1"
emacs_libgccjit_dev_package: "libgccjit-13-dev"
emacs_lsp_booster_version: "v0.2.1"
emacs_lsp_booster_archive_name: "emacs-lsp-booster_v0.2.1_x86_64-unknown-linux-musl.zip"
emacs_lsp_booster_binary_sha256: "30eae1ba447ac5f2a87a45dab02d612b6afac6b6652ade31b736a6984de24cd6"
ltex_plus_version: "18.7.0"
ltex_plus_archive_name: "ltex-ls-plus-18.7.0-linux-x64.tar.gz"
ltex_plus_archive_sha256: "1e16df6c578dc76ff97d644445d126ba6fba5c2e8e174178ab86372652fd7612"
remede_index_url: "https://github.com/camarm-dev/remede/releases/download/1.4.0/remede.index"
