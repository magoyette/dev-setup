remede_dict_url: "https://github.com/camarm-dev/remede/releases/download/1.4.0/remede.dict"
remede_dict_sha256: "10a96818d6bc7fb7ea719b24354013a5811a4834fe026d72fbabb9fd90216d64"
tree_sitter_version: "0.26.13"
tree_sitter_tarball_sha256: "ece24c3c5e2a76384075e830c7139b59fce8fb01e4ef8436fab08bbe10444c89"
emacs_min_treesit_abi_version: 15
difftastic_version: "0.67.0"
hadolint_version: "v2.14.0"
tokei_version: "v12.1.2"
starship_version: "v1.24.2"
gh_version: "v2.102.0"
gh_linux_amd64_archive_name: "gh_2.102.0_linux_amd64.tar.gz"
gh_linux_amd64_sha256: "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386"
bat_theme: "OneHalfDark"
herdr_theme: "one-dark"
delta_syntax_theme: "OneHalfDark"
hunk_theme: "one-dark-pro"
ccstatusline_theme: "onedark"
crit_version: "v0.16.1"
crit_linux_amd64_sha256: "ba489abaf89f0402acf5a5ddd12305e43b72f4fef1586e429fb64dad799ef61a"
codex_project_doc_max_bytes: 1073741824
claude_sandbox_enabled: true
# AI assistant commands that should run through nono.sh when the launcher
# wrapper finds nono.sh or nono.
ai_assistants_nono_enabled_launchers:
  - opencode
# Enabled AI assistant launcher commands that fail closed when nono.sh or nono
# is unavailable.
ai_assistants_nono_required_launchers:
  - opencode
# Managed nono profile names used by the assistant launcher wrappers. The
# profiles are deployed from nono/.config/nono/profiles/.
ai_assistants_nono_profiles:
  opencode: opencode
# Grant each launcher's working directory through nono --allow-cwd without the
# interactive sharing prompt. false restores the per-launch confirmation.
ai_assistants_nono_allow_cwd: true
# Opt-in Windows interop disable for this distribution. Set true in
# ansible/vars.yml: the core playbook writes [interop] enabled=false and
# appendWindowsPath=false to /etc/wsl.conf and switches Git credentials from
# the Windows Git Credential Manager to gh. The change applies after
# wsl --shutdown. See docs/wsl-interop.md for the impact analysis.
wsl_disable_interop: false
ai_assistants_mcp_catalog:
  context7:
    url: https://mcp.context7.com/mcp
  grep:
    url: https://mcp.grep.app
ai_assistants_mcps:
  - context7
  - grep
codex_status_line:
  - model-with-reasoning
  - fast-mode
  - context-used
  - current-dir
  - git-branch
  - five-hour-limit
  - weekly-limit

# Claude Code third-party marketplaces (GitHub repo paths)
claude_code_marketplaces:
  - openai/codex-plugin-cc
  - tomasz-tomczyk/crit

# Claude Code plugins installed from the official marketplace
claude_code_plugins:
  - skill-creator@claude-plugins-official
  - claude-md-management@claude-plugins-official
  - claude-code-setup@claude-plugins-official
  - frontend-design@claude-plugins-official
  - feature-dev@claude-plugins-official
  - codex@openai-codex
  - crit@crit

# npm global packages required by Emacs LSP mode and formatting tools
emacs_npm_packages:
  - "@ansible/ansible-language-server"
  - "@astrojs/language-server"
  - bash-language-server
  - eslint
  - js-yaml
  - prettier
  - prettier-plugin-astro
  - prettier-plugin-tailwindcss
  - stylelint
  - stylelint-config-standard
  - typescript
  - typescript-language-server
  - vscode-langservers-extracted
  - yaml-language-server
